name: 1 - Video erstellen

on:
  schedule:
    - cron: "0 6 * * *"    # 7/8 Uhr deutsche Zeit
    - cron: "0 15 * * *"   # 16/17 Uhr deutsche Zeit
  workflow_dispatch:        # zusätzlich per Knopfdruck startbar

concurrency:
  group: ki-team
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-liberation
      - run: pip install -r requirements.txt
      - name: KI-Team arbeiten lassen
        run: python main.py create
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Gedächtnis speichern
        if: always()
        run: |
          git config user.name "ki-team"
          git config user.email "ki-team@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Neuer Entwurf" && git pull --rebase && git push)
