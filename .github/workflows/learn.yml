name: 3 - Lernen

on:
  schedule:
    - cron: "30 21 * * *"   # jeden Abend
  workflow_dispatch:

concurrency:
  group: ki-team
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Zahlen auswerten und Erkenntnisse aktualisieren
        run: python main.py learn
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Gedächtnis speichern
        if: always()
        run: |
          git config user.name "ki-team"
          git config user.email "ki-team@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Neue Erkenntnisse" && git pull --rebase && git push)
