name: 2 - Freigaben prüfen und posten

on:
  schedule:
    - cron: "*/30 5-21 * * *"   # alle 30 Minuten zwischen ca. 6 und 23 Uhr
  workflow_dispatch:

concurrency:
  group: ki-team
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Freigaben abholen und veröffentlichen
        run: python main.py check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      - name: Gedächtnis speichern
        if: always()
        run: |
          git config user.name "ki-team"
          git config user.email "ki-team@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Freigaben verarbeitet" && git pull --rebase && git push)
