name: 5 - Geschäftsführerin (Wochenplan + Briefing)

on:
  schedule:
    - cron: "15 5 * * *"    # jeden Morgen ca. 6:15/7:15 Uhr: Briefing
    - cron: "0 16 * * 0"    # sonntags ca. 17/18 Uhr: Wochenplan für die neue Woche
  workflow_dispatch:

concurrency:
  group: ki-team
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  manage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Planen und briefen
        run: python main.py manage
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Gedächtnis speichern
        if: always()
        run: |
          git config user.name "ki-team"
          git config user.email "ki-team@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Geschäftsführung" && git pull --rebase && git push)
