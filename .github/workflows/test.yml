name: 0 - Testlauf (ohne Posten)

# Erstellt ein Video, postet aber nichts. Das Video kannst du unten bei "Artifacts" herunterladen.

on:
  workflow_dispatch:
    inputs:
      profil:
        description: "Welches Profil testen?"
        type: choice
        options: ["df", "geschenkheld"]
        default: "df"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: ffmpeg + Schrift installieren (max. 2,5 Min., sonst ffmpeg aus pip)
        run: timeout 150 bash -c "sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-liberation" || echo "Ubuntu-Paketquelle nicht erreichbar – ffmpeg kommt aus pip (imageio-ffmpeg)"
      - run: pip install -r requirements.txt
      - run: python main.py create --dry-run
        env:
          PROFIL: ${{ inputs.profil }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: testvideo
          path: |
            output/*/final.mp4
            output/*/titelbild.jpg
            output/*/folie_*.png
            output/*/skript.json
