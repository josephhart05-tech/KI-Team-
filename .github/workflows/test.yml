name: 0 - Testlauf (ohne Posten)

# Erstellt ein Video, postet aber nichts. Das Video kannst du unten bei "Artifacts" herunterladen.

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-liberation
      - run: pip install -r requirements.txt
      - run: python main.py create --dry-run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: testvideo
          path: |
            output/*/final.mp4
            output/*/skript.json
