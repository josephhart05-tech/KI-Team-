# ============================================================
#  KI-Team Konfiguration – hier stellst du alles ein.
#  Geheime Schlüssel gehören NICHT hierher, sondern in die
#  GitHub-Secrets (siehe ANLEITUNG.md).
# ============================================================

nische:
  thema: "Nebeneinkommen neben dem Hauptjob aufbauen – mit Affiliate-Marketing und digitalen Produkten über Social Media"
  # Themen, die das Team NIE wählt (rechtlich heikel oder passen nicht zu deinem Business)
  tabu_themen: "Geldanlage, Aktien, ETFs, Dividenden, Krypto, Trading, Forex, Immobilien, Kredite, Steuertricks, Glücksspiel"
  zielgruppe: "Angestellte in Deutschland, 25-45 Jahre, wenig Zeit, wollen sich realistisch etwas nebenbei aufbauen"
  tonalitaet: "ehrlich, motivierend, konkret, per du, keine Hype-Sprache"
  sprache: "Deutsch"

# Deine Affiliate-Produkte. Trage hier deine echten Produkte ein.
# "link" ist dein Affiliate-Link (z. B. Digistore24 / CopeCart).
# Da Links auf Instagram/TikTok nicht klickbar sind, verweisen die Videos
# auf "Link in Bio" – dort sollte dein Link-Sammelseite (z. B. Linktree) stehen.
produkte:
  - id: tac-webinar
    name: "Kostenloses Webinar TAC 3.0"
    link: "https://dfdigitalefreiheit.com"
    beschreibung: "Kostenloses Webinar: wie man Schritt für Schritt einen Social-Media-Account für Affiliate-Marketing mit digitalen Produkten aufbaut"
    passt_zu: "Einstieg ins Affiliate-Marketing, Social-Media-Account aufbauen, digitale Produkte empfehlen, erste Schritte neben dem Job, kostenlos lernen"

# Anteil der Videos, die ein Produkt bewerben (0.4 = 40 %).
# Der Rest ist reiner Mehrwert-Content – das baut Vertrauen und Reichweite auf.
werbe_anteil: 0.4

recherche:
  suchbegriffe:
    - "nebeneinkommen"
    - "nebenbei geld verdienen"
    - "passives einkommen"
    - "nebenjob von zuhause"
    - "digitale produkte verkaufen"
    - "side hustle deutschland"
  subreddits:
    - "Finanzen"
    - "selbststaendig"
    - "sidehustle"

video:
  stimme: "de-DE-ConradNeural"     # Alternativen: de-DE-KatjaNeural, de-DE-FlorianMultilingualNeural
  sprechtempo: "+8%"
  schriftart: "Arial"
  untertitel:
    groesse: 70              # vorher 92 – kleiner = weniger Text verdeckt
    farbe: "#FFFFFF"         # normale Wörter (weiß)
    hervorhebung: "#D4AF37"  # gerade gesprochenes Wort (Gold). Alternativen: "#FFD400" gelb, "#00E676" grün
  # Farbstimmung der Stock-Videos (Schwarz-Gold-Look)
  look:
    aktiv: true
    helligkeit: -0.08        # negativ = dunkler
    saettigung: 0.85         # unter 1 = gedämpftere Farben
    gold_ton: 0.15           # 0 = neutral, 0.3 = sehr golden
    vignette: true           # dunkler Rand
  # Dein Branding oben im Video
  marke:
    text: "dfdigitalefreiheit.com"
    farbe: "#D4AF37"
    groesse: 40
  bildstil: "dunkle, edle Szenen: Nacht, Schreibtisch mit warmem Licht, schwarze Oberflächen, Gold-Akzente, elegant"
  ersatz_suche: "person working on laptop"   # Stock-Video, falls nichts passt

plattformen:
  instagram:
    aktiv: true
    # "telegram" = Video + Caption kommen in Telegram, du postest mit 2 Klicks selbst
    # "auto"     = automatisch posten (braucht IG_ACCESS_TOKEN / IG_USER_ID, siehe ANLEITUNG.md)
    modus: "telegram"
    login: "facebook"        # nur für modus "auto": "facebook" (Seiten-Token) oder "instagram"
    api_version: "v23.0"
  tiktok:
    aktiv: true
    # "telegram" = Video kommt in Telegram, du lädst es mit 2 Klicks selbst hoch (sofort nutzbar)
    # "entwurf"  = Video landet automatisch als Entwurf in deiner TikTok-App (braucht TikTok-Entwickler-App)
    modus: "telegram"

kennzeichnung:
  instagram: "Werbung | enthält Affiliate-Link"
  tiktok: "#werbung #affiliate"

llm:
  gemini_modell: "gemini-3.6-flash"
  groq_modell: "llama-3.3-70b-versatile"   # Ersatz, falls Gemini nicht erreichbar ist

# Wörter, die bei diesem Thema schnell irreführend oder unseriös wirken.
# Der Prüfer-Agent lehnt Skripte mit diesen Formulierungen ab.
verbotene_formulierungen:
  - "garantiert"
  - "ohne arbeit"
  - "schnell reich"
  - "über nacht"
  - "risikofrei"
  - "jeder kann"
  - "100% sicher"
