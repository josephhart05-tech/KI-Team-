# ============================================================
#  KI-Team Konfiguration – hier stellst du alles ein.
#  Geheime Schlüssel gehören NICHT hierher, sondern in die
#  GitHub-Secrets (siehe ANLEITUNG.md).
# ============================================================

nische:
  thema: "Faceless Nebeneinkommen aufbauen – mit Instagram, Digistore24 und anderen Affiliate-Partnern"
  # Die eine Botschaft, auf die JEDES Video einzahlt
  kernbotschaft: "Ich baue mir neben dem Job Schritt für Schritt ein faceless Nebeneinkommen auf – mit Instagram, Digistore24 und anderen Affiliate-Partnern – und teile ehrlich alles, was ich dabei lerne, damit du es auch kannst. Es braucht Zeit und Einsatz, aber keine Kamera und kein eigenes Produkt."
  # Themen, die das Team NIE wählt (rechtlich heikel oder passen nicht zu deinem Business)
  tabu_themen: "Geldanlage, Aktien, ETFs, Dividenden, Krypto, Trading, Forex, Immobilien, Kredite, Steuertricks, Glücksspiel"
  zielgruppe: "Angestellte in Deutschland, 25-45 Jahre, wenig Zeit, wollen sich realistisch etwas nebenbei aufbauen – viele wollen dafür nicht vor die Kamera"
  tonalitaet: "ehrlich, motivierend, konkret, per du, keine Hype-Sprache"
  sprache: "Deutsch"

# Deine Affiliate-Produkte. Trage hier deine echten Produkte ein.
# "link" ist dein Affiliate-Link (z. B. Digistore24 / CopeCart).
# Da Links auf Instagram/TikTok nicht klickbar sind, verweisen die Videos
# auf "Link in Bio" – dort sollte dein Link-Sammelseite (z. B. Linktree) stehen.
produkte:
  - id: tac-webinar
    name: "Kostenloses Webinar TAC 3.0"
    link: "https://dfdigitalefreiheit.com"
    beschreibung: "Kostenloses Webinar: wie man Schritt für Schritt einen Social-Media-Account für Affiliate-Marketing mit digitalen Produkten aufbaut"
    passt_zu: "Einstieg ins Affiliate-Marketing, Social-Media-Account aufbauen, digitale Produkte empfehlen, erste Schritte neben dem Job, kostenlos lernen"

# Content-Strategie: Ziele und Formate wechseln sich der Reihe nach ab.
# - "einblick" kommt nur dran, wenn du per /tagebuch etwas Echtes erzählt hast (sonst übersprungen).
# - "monetarisierung" kommt erst dran, wenn du es per /webinar an freischaltest (sonst übersprungen).
strategie:
  ziel_rotation: ["wachstum", "einblick", "interaktion", "wachstum", "einblick", "monetarisierung"]
  format_rotation: ["reel", "reel", "karussell"]
  # Feste Serien = Wiedererkennung. Erscheinen als goldenes Abzeichen mit Nummer (z. B. "DF-TAGEBUCH #5").
  serien:
    wachstum: "DF-TIPP"
    einblick: "DF-TAGEBUCH"
    interaktion: "DF-FRAGE"
    monetarisierung: "DF-EMPFEHLUNG"
  ziele:
    einblick: >-
      Build in Public: Zeig ehrlich, wie ich mir Schritt für Schritt mein faceless Business aufbaue –
      was ich gerade mache, was funktioniert hat, was nicht, und was ich daraus gelernt habe.
      Ich-Perspektive, nahbar, mit einer Lektion, die der Zuschauer für sich mitnehmen kann.
      Call-to-Action: Folgen, um den Weg mitzuverfolgen, oder Frage nach den Erfahrungen der Zuschauer.
    wachstum: >-
      Reichweite und neue Follower. Breites, teilbares Thema mit überraschender Erkenntnis oder
      typischem Fehler, den viele machen. Mehrwert, den man speichern will.
      Call-to-Action: Speichern, an einen Freund schicken oder Folgen für mehr.
    interaktion: >-
      Kommentare und Gespräche. Meinungsfrage, Entweder-oder, kleine Challenge oder
      "Welcher Typ bist du?". Die Zielgruppe soll sich wiedererkennen und antworten wollen.
      Call-to-Action: konkrete, leicht zu beantwortende Frage oder "Kommentiere 1 oder 2".
    monetarisierung: >-
      Klicks auf den Link in der Bio. Konkretes Problem der Zielgruppe, ehrliche Lösung,
      das Produkt als logischer nächster Schritt – ohne Druck und ohne Versprechen.
      Call-to-Action: "Link in meiner Bio".
  hashtags:
    anzahl_instagram: 5   # Instagram empfiehlt 3-5 gezielte Hashtags
    anzahl_tiktok: 4
    marke: "dfdigitalefreiheit"

recherche:
  suchbegriffe:
    - "faceless instagram"
    - "faceless account"
    - "digistore24"
    - "affiliate marketing"
    - "affiliate marketing instagram"
    - "nebeneinkommen online"
    - "digitale produkte"
  subreddits:
    - "selbststaendig"
    - "Affiliatemarketing"
    - "InstagramMarketing"

video:
  stimme: "de-DE-ConradNeural"     # Alternativen: de-DE-KatjaNeural, de-DE-FlorianMultilingualNeural
  sprechtempo: "+8%"
  schriftart: "Arial"
  untertitel:
    groesse: 70              # vorher 92 – kleiner = weniger Text verdeckt
    farbe: "#FFFFFF"         # normale Wörter (weiß)
    hervorhebung: "#D4AF37"  # gerade gesprochenes Wort (Gold). Alternativen: "#FFD400" gelb, "#00E676" grün
  # Farbstimmung der Stock-Videos (Schwarz-Gold-Look)
  look:
    aktiv: true
    helligkeit: -0.08        # negativ = dunkler
    saettigung: 0.85         # unter 1 = gedämpftere Farben
    gold_ton: 0.15           # 0 = neutral, 0.3 = sehr golden
    vignette: true           # dunkler Rand
  # Dein Branding oben im Video
  marke:
    text: "dfdigitalefreiheit.com"
    farbe: "#D4AF37"
    groesse: 40
    # Fester Abspann am Ende jedes Reels (letzte ~2 Sekunden)
    abspann_titel: "DF · DIGITALE FREIHEIT"
    abspann_text: "Folge für mehr"
  bildstil: "dunkle, edle Szenen: Nacht, Schreibtisch mit warmem Licht, schwarze Oberflächen, Gold-Akzente, elegant"
  ersatz_suche: "person working on laptop"   # Stock-Video, falls nichts passt

plattformen:
  instagram:
    aktiv: true
    # "telegram" = Video + Caption kommen in Telegram, du postest mit 2 Klicks selbst
    # "auto"     = automatisch posten (braucht IG_ACCESS_TOKEN / IG_USER_ID, siehe ANLEITUNG.md)
    modus: "telegram"
    login: "facebook"        # nur für modus "auto": "facebook" (Seiten-Token) oder "instagram"
    api_version: "v23.0"
  tiktok:
    aktiv: true
    # "telegram" = Video kommt in Telegram, du lädst es mit 2 Klicks selbst hoch (sofort nutzbar)
    # "entwurf"  = Video landet automatisch als Entwurf in deiner TikTok-App (braucht TikTok-Entwickler-App)
    modus: "telegram"

kennzeichnung:
  instagram: "Werbung | enthält Affiliate-Link"
  tiktok: "#werbung #affiliate"

llm:
  gemini_modell: "gemini-3.6-flash"
  groq_modell: "llama-3.3-70b-versatile"   # Ersatz, falls Gemini nicht erreichbar ist

# Wörter, die bei diesem Thema schnell irreführend oder unseriös wirken.
# Der Prüfer-Agent lehnt Skripte mit diesen Formulierungen ab.
verbotene_formulierungen:
  - "garantiert"
  - "ohne arbeit"
  - "schnell reich"
  - "über nacht"
  - "risikofrei"
  - "jeder kann"
  - "100% sicher"
